name: kraken-ohlc
on:
  schedule:
    - cron: "7 */6 * * *"   # 00:07, 06:07, 12:07, 18:07 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: ohlc
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bougies BTC/EUR (daily + horaire)
        run: |
          set -euo pipefail
          mkdir -p data
          for iv in 1440 60; do
            curl -fsS --retry 3 --retry-delay 15 -o tmp.json \
              "https://api.kraken.com/0/public/OHLC?pair=XBTEUR&interval=${iv}"
            jq -e '(.error | length == 0) and (.result.XXBTZEUR | length > 100)' tmp.json > /dev/null
            mv tmp.json "data/kraken_xbteur_${iv}.json"
          done
          date -u +%Y-%m-%dT%H:%M:%SZ > data/last_update.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "OHLC $(date -u +%FT%H:%MZ)"
          git push
